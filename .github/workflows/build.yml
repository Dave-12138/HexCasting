name: Build

on:
  workflow_dispatch:
    inputs:
      hexmod-ref:
        description: "HexMod branch, tag, or SHA to build"
        required: false
        type: string
        default: "1.21"
      paucal-ref:
        description: "PAUCAL branch, tag, or SHA to build"
        required: false
        type: string
        default: "1.21"

      publish_release:
        description: "Publish the built jars to a GitHub Release"
        required: false
        type: boolean
        default: false

      release_tag:
        description: "Release tag to publish under (required when publishing), e.g. v0.12.0"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  JAVA_VERSION: "21"

jobs:
  build-paucal:
    name: Build PAUCAL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PAUCAL
        uses: actions/checkout@v7
        with:
          repository: FallingColors/PAUCAL
          ref: ${{ inputs.paucal-ref }}
          path: PAUCAL
          # gradle config runs git range queries (HEAD~..HEAD); needs full history
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        working-directory: PAUCAL
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Stage artifacts
        working-directory: PAUCAL
        run: |
          mkdir -p dist
          # usable mod files only: whitelist the final Fabric/NeoForge runnable jars;
          # this drops every architectury intermediate regardless of where it lives
          # (Common xplat jar, *-transformProduction* incl. bare Common-transformProduction*)
          find Common Fabric Neoforge -path '*/build/libs/*.jar' \
            \( -name 'paucal-*-fabric.jar' -o -name 'paucal-*-neoforge.jar' \) \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            ! -name '*-shadow.jar' ! -name '*-dev.jar' ! -name '*-dev-shadow.jar' \
            -exec cp {} dist/ \;
          find dist -name '*.jar' | grep -q . || { echo 'Error: no final mod jars staged' >&2; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: paucal-build
          path: PAUCAL/dist
          retention-days: 30

  build-hexmod:
    name: Build HexMod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HexMod
        uses: actions/checkout@v7
        with:
          repository: FallingColors/HexMod
          ref: ${{ inputs.hexmod-ref }}
          path: HexMod
          # gradle config runs git range queries (HEAD~..HEAD); needs full history
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        working-directory: HexMod
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Stage artifacts
        working-directory: HexMod
        run: |
          mkdir -p dist
          # usable mod files only: whitelist the final Fabric/NeoForge runnable jars;
          # this drops every architectury intermediate regardless of where it lives
          # (Common xplat jar, *-transformProduction* incl. bare Common-transformProduction*)
          find Common Fabric Neoforge -path '*/build/libs/*.jar' \
            \( -name 'hexcasting-fabric-*.jar' -o -name 'hexcasting-neoforge-*.jar' \) \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            ! -name '*-shadow.jar' ! -name '*-dev.jar' ! -name '*-dev-shadow.jar' \
            -exec cp {} dist/ \;
          find dist -name '*.jar' | grep -q . || { echo 'Error: no final mod jars staged' >&2; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hexmod-build
          path: HexMod/dist
          retention-days: 30

  publish-release:
    name: Publish jars to GitHub Release
    needs: [build-paucal, build-hexmod]
    if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download PAUCAL jars
        uses: actions/download-artifact@v7
        with:
          name: paucal-build
          path: release/paucal

      - name: Download HexMod jars
        uses: actions/download-artifact@v7
        with:
          name: hexmod-build
          path: release/hexmod

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          files: |
            release/paucal/**/*.jar
            release/hexmod/**/*.jar
          body: |
            Automated build of HexMod and PAUCAL.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          generate_release_notes: true
